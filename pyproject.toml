[project]
name = "utility-hub"
version = "0.1.0"
description = "Private, focused tools for everyday security operations"
readme = "README.md"
authors = [{name = "Ehsaan Mehar"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<1",
  "starlette>=0.47.2,<2",
  "pydantic>=2.10,<3",
  "anyio>=4,<5",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "regex>=2024.11.6",
  "idna>=3.7,<4",
  "jmespath>=1.0.1,<2",
  "simplejson>=3.20,<4",
  "pyspellchecker>=0.8.2,<1",
  "cryptography>=43",
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "defusedxml>=0.7.1,<1",
]

[project.urls]
"Author GitHub" = "https://github.com/meharehsaan"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.50,<2", "pytest-playwright>=0.7,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
