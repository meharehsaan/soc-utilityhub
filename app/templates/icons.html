{# Original lightweight line icons; no icon library or network requests. #}
{% macro icon(symbol, size=24) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="ui-icon" data-icon="{{ symbol }}">
{% if symbol == 'sanitize' %}
  <path d="M12 3 20 6v5c0 5-4 8-8 10-4-2-8-5-8-10V6z"/><path d="m8 12 3 3 5-6"/>
{% elif symbol == 'text' %}
  <path d="M4 5h11M4 10h8M4 15h6M18 4v16m-3-3 3 3 3-3M4 20h6"/>
{% elif symbol == 'logs' %}
  <rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4M7 6h.01"/>
{% elif symbol == 'json' %}
  <path d="M8 3H6v6l-3 3 3 3v6h2m8-18h2v6l3 3-3 3v6h-2"/><circle cx="12" cy="8" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="12" cy="16" r=".6"/>
{% elif symbol == 'hash' %}
  <path d="m10 3-4 18M18 3l-4 18M3 8h18M2 16h18"/>
{% elif symbol == 'encoder' %}
  <path d="m7 5-5 7 5 7m10-14 5 7-5 7m-3-16-4 18"/>
{% elif symbol == 'compare' %}
  <path d="M8 3v18M16 3v18M3 7h10m-3-3 3 3-3 3m11 7H11m3-3-3 3 3 3"/>
{% elif symbol == 'ioc' %}
  <path d="M8 3H4v4m12-4h4v4M4 17v4h4m12-4v4h-4"/><circle cx="12" cy="12" r="5"/><path d="m15.5 15.5 3 3M12 9v6m-3-3h6"/>
{% elif symbol == 'timestamp' %}
  <circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2m3 3h5m-3-2 3 2-3 2M8 21h8"/>
{% elif symbol == 'url' %}
  <path d="m10 8 2-2a4 4 0 0 1 6 6l-2 2m-2 2-2 2a4 4 0 0 1-6-6l2-2m1 5 6-6"/><path d="M17 3h4v4"/>
{% elif symbol == 'email' %}
  <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6m-18 11 6-6m12 6-6-6"/>
{% elif symbol == 'jwt' %}
  <path d="m12 2 8.5 5v10L12 22l-8.5-5V7z"/><circle cx="10" cy="11" r="2.5"/><path d="m12 13 4 4m-1-1 2-2"/>
{% elif symbol == 'timeline' %}

{% elif symbol == 'events' %}
  <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12m0-6h12M7 3v3m10-3v3m-4 6h4"/>
{% elif symbol == 'query' %}
  <path d="M4 4h16L14 12v6l-4 3v-9z"/><path d="m16 16 5 5m0-5-5 5"/>
{% elif symbol == 'sigma' %}
  <path d="M19 4H5l7 8-7 8h14M17 8h4m-4 8h4"/>
{% elif symbol == 'process-tree' %}
  <rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5H5v5m7-5h7v5"/>
{% elif symbol == 'certificate' %}
  <path d="M14 3H5v18h7m2-18 5 5v4m-5-9v5h5M8 7h3m-3 4h6"/><circle cx="17" cy="16" r="3"/><path d="m15 18-1 4 3-1 3 1-1-4"/>
{% elif symbol == 'strings' %}
  <rect x="2" y="5" width="20" height="14" rx="3"/><path d="m5 15 3-6 3 6m-5-2h4m4-4v6h3m-2-3h2m2-3v6"/>
{% elif symbol == 'unicode' %}
  <path d="M4 4v9a4 4 0 0 0 8 0V4m4 2h5m-2.5-2.5v5M4 21h16m-3-9 4 4m0-4-4 4"/>
{% elif symbol == 'stix' %}
  <path d="m12 2 9 5v10l-9 5-9-5V7zm0 10 9-5m-9 5L3 7m9 5v10"/><path d="m7.5 4.5 9 5"/>
{% elif symbol == 'report' %}
  <path d="M14 3H5v18h14V8zm0 0v5h5M8 12h8m-8 4h5"/><path d="m8 7 1 1 2-2"/>
{% elif symbol == 'spell' %}
  <path d="m3 15 4-11 4 11m-6-4h4m5-7h3a3 3 0 0 1 0 6h-3V4m0 6v5h3a2.5 2.5 0 0 0 0-5M8 19l3 3 8-7"/>

  <circle cx="5" cy="17" r="1"/><path d="M15 3v14m-6-10 12 6m-12 0 12-6M3 4v4m-2-2h4"/>
{% elif symbol == 'signature' %}
  <path d="m4 15 12-12 5 5L9 20l-6 1zM13 6l5 5M12 21h10M5 14l5 5"/>
{% elif symbol == 'user-agent' %}
  <rect x="2" y="3" width="20" height="15" rx="3"/><path d="M2 8h20M6 5h.01M9 5h.01M8 22h8m-4-4v4"/><circle cx="12" cy="13" r="2"/>
{% elif symbol == 'cron' %}
  <circle cx="14" cy="14" r="7"/><path d="M14 10v4l3 2M4 4h12M3 8h4M2 12h3m0-10 2 2-2 2"/>
{% elif symbol == 'cidr' %}
  <circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/>
{% elif symbol == 'mac' %}
  <rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/><rect x="9" y="9" width="6" height="6" rx="1"/>
{% elif symbol == 'user-sid' %}
  <path d="M14 3H4v18h16V9m-6-6 6 6h-6z"/><circle cx="10" cy="11" r="2"/><path d="M7 17a3 3 0 0 1 6 0m3-4h2m-2 4h2"/>
{% elif symbol == 'http-status' %}
  <rect x="2" y="3" width="20" height="18" rx="3"/><path d="M2 8h20m-15 5 2 2 4-4m3 1h3m-3 4h3M6 5.5h.01M9 5.5h.01"/>
{% elif symbol == 'entropy' %}
  <path d="M3 21h18M5 17v-4m4 4V5m4 12V9m4 8V3m4 14v-6"/>
{% elif symbol == 'brand' %}

{% elif symbol == 'grid' %}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif symbol == 'book' %}
  <path d="M12 5C9 3 6 3 3 4v16c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1zm0 0v16"/>
{% elif symbol == 'menu' %}
  <path d="M4 6h16M4 12h16M4 18h16"/>
{% elif symbol == 'close' %}
  <path d="m6 6 12 12M6 18 18 6"/>
{% elif symbol == 'panel' %}
  <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18m7-13-4 4 4 4"/>
{% elif symbol == 'sun' %}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
{% elif symbol == 'moon' %}
  <path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10z"/>
{% elif symbol == 'arrow-right' %}
  <path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif symbol == 'search' %}
  <circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif symbol == 'browser' %}
  <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M6 6.5h.01M9 6.5h.01"/>
{% elif symbol == 'server' %}
  <rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01m4-11h6m-6 11h6"/>
{% elif symbol == 'layers' %}
  <path d="m12 3 10 6-10 6L2 9zm-9 11 9 5 9-5M3 18l9 5 9-5"/>
{% else %}
  <circle cx="12" cy="12" r="8"/>
{% endif %}
</svg>
{%- endmacro %}
