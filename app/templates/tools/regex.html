{% extends "workspace.html" %}
{% block options %}<div class="option-row"><label>Template<select name="template"><option value="custom">Custom pattern</option><option value="literal">Escape a literal</option><option value="cve">CVE identifier</option><option value="timestamp">ISO timestamp syntax</option><option value="ipv4">IPv4 syntax</option><option value="base64">Base64-like blob</option><option value="windows">Windows path syntax</option></select></label><label>JavaScript flags<input class="field-input" name="flags" value="g" maxlength="5"></label></div><label class="field-label">Pattern<input class="field-input" name="pattern" maxlength="2048" value="CVE-\d{4}-\d{4,}"></label><label class="field-label">Literal for builder<input class="field-input" name="literal" maxlength="512"></label>{% endblock %}
