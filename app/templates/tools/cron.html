{% extends "workspace.html" %}
{% block options %}<div class="option-row"><label>Dialect<select name="dialect"><option value="unix">Unix · 5 fields</option><option value="seconds">Seconds first · 6 fields</option></select></label><label>IANA timezone<input class="field-input" name="zone" value="UTC" maxlength="128"></label></div><div class="option-row"><label>Reference ISO instant<input class="field-input" name="reference" maxlength="64" placeholder="2026-01-01T00:00:00Z"></label><label>Horizon days<input class="field-input" name="horizon_days" type="number" min="1" max="366" value="366"></label></div>{% endblock %}
{% block note %}Preview next five real UTC instants with selected timezone labels. Day fields use the documented Unix OR rule. No schedule or job is created. Processing happens entirely in your browser.{% endblock %}
