{% extends "workspace.html" %}
{% block options %}<div class="option-row"><label>Report title<input class="field-input" name="title" type="text" value="Investigation handover" maxlength="256"></label></div>{% endblock %}
{% block extra %}<label class="field-label">Timeline<textarea class="source-area short" name="timeline" maxlength="100000"></textarea></label><label class="field-label">Indicators<textarea class="source-area short" name="indicators" maxlength="100000"></textarea></label><label class="field-label">Actions taken<textarea class="source-area short" name="actions" maxlength="100000"></textarea></label><label class="field-label">Open questions / gaps<textarea class="source-area short" name="gaps" maxlength="100000"></textarea></label><label class="field-label">Next steps<textarea class="source-area short" name="next_steps" maxlength="100000"></textarea></label>{% endblock %}
{% block note %}Markdown formatting only. This tool does not invent evidence or conclusions, save cases, or render supplied Markdown as HTML.{% endblock %}
